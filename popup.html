<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Quillan-Ronin Sovereign Agent</title>
<style>
  :root {
    --bg: #090c10;
    --panel: #12171f;
    --panel-hover: #1b222d;
    --line: #212936;
    --line-glow: #00e5ff33;
    --txt: #f0f4f8;
    --dim: #8b99a8;
    --cyan: #00e5ff;
    --cyan-glow: rgba(0, 229, 255, 0.2);
    --gold: #ffc83b;
    --red: #ff3366;
    --purple: #b066ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 420px; height: 600px; background: var(--bg); color: var(--txt);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    padding: 10px 14px; background: linear-gradient(180deg, #161d27 0%, var(--panel) 100%);
    border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .hrow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .brand {
    font-size: 14px; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 6px;
    background: linear-gradient(90deg, #fff 0%, var(--cyan) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .council-badge {
    font-size: 10px; font-weight: 700; color: var(--gold); background: rgba(255, 200, 59, 0.12);
    border: 1px solid rgba(255, 200, 59, 0.3); padding: 2px 7px; border-radius: 12px; letter-spacing: 0.5px;
  }
  .btns { display: flex; gap: 5px; flex-wrap: wrap; }
  .mini {
    background: var(--panel); border: 1px solid var(--line); color: var(--txt);
    font-size: 11px; padding: 4px 8px; border-radius: 6px; cursor: pointer; transition: all 0.15s ease;
  }
  .mini:hover { border-color: var(--cyan); color: var(--cyan); background: var(--panel-hover); }
  .mini.sub { color: var(--cyan); border-color: rgba(0, 229, 255, 0.3); }
  .mini.gold { color: var(--gold); border-color: rgba(255, 200, 59, 0.3); }
  .mini.red { color: var(--red); border-color: rgba(255, 51, 102, 0.3); }
  
  #actionToolbar {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 6px 12px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .action-btn {
    background: #171e28; border: 1px solid var(--line); color: var(--dim);
    font-size: 10.5px; font-weight: 600; padding: 6px 2px; border-radius: 6px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 3px;
    transition: all 0.15s ease; white-space: nowrap;
  }
  .action-btn:hover { background: var(--panel-hover); color: #fff; border-color: var(--cyan); }
  .action-btn.active { color: var(--cyan); border-color: var(--cyan); background: rgba(0, 229, 255, 0.08); }
  .action-btn.chess { color: var(--gold); border-color: rgba(255, 200, 59, 0.3); }
  .action-btn.chess:hover { border-color: var(--gold); background: rgba(255, 200, 59, 0.1); }
  
  #log {
    flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 92%; padding: 9px 12px; border-radius: 8px; font-size: 13px; line-height: 1.45;
    word-break: break-word; position: relative;
  }
  .user {
    align-self: flex-end; background: rgba(176, 102, 255, 0.14);
    border-right: 3px solid var(--purple); color: #fdfdfd; border-radius: 8px 2px 8px 8px;
  }
  .quillan {
    align-self: flex-start; background: rgba(0, 229, 255, 0.08);
    border-left: 3px solid var(--cyan); color: var(--txt); border-radius: 2px 8px 8px 8px;
  }
  .quillan pre {
    background: #06080b; padding: 8px; border-radius: 6px; margin: 6px 0; overflow-x: auto;
    font-family: 'Consolas', monospace; font-size: 11.5px; border: 1px solid var(--line);
  }
  .quillan code {
    font-family: 'Consolas', monospace; background: rgba(255, 255, 255, 0.08); padding: 1px 4px; border-radius: 4px; font-size: 12px;
  }
  .sys {
    align-self: center; background: transparent; color: var(--dim); font-size: 11px; text-align: center;
    border: 1px dashed var(--line); padding: 4px 10px; border-radius: 12px;
  }
  .cursor::after {
    content: '▋'; color: var(--cyan); animation: blink 0.8s infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  
  #historyPanel {
    display: none; position: absolute; top: 85px; left: 10px; right: 10px; bottom: 80px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    overflow-y: auto; z-index: 20; padding: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .chatrow { padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 6px; }
  .chatrow:hover { background: rgba(0, 229, 255, 0.08); }
  .chatrow b { display: block; font-size: 12px; color: var(--txt); }
  .chatrow span { font-size: 10px; color: var(--dim); }

  footer {
    padding: 10px 14px; background: var(--panel); border-top: 1px solid var(--line); flex-shrink: 0;
    display: flex; flex-direction: column; gap: 8px;
  }
  .input-row { display: flex; gap: 6px; }
  input {
    flex: 1; background: #0b0e13; border: 1px solid var(--line); border-radius: 6px;
    color: var(--txt); padding: 8px 10px; font-size: 13px; outline: none; transition: border-color 0.2s;
  }
  input:focus { border-color: var(--cyan); box-shadow: 0 0 0 2px var(--cyan-glow); }
  button.send-btn {
    background: var(--cyan); color: #051017; border: none; border-radius: 6px;
    font-weight: 700; padding: 8px 14px; cursor: pointer; transition: filter 0.15s;
  }
  button.send-btn:hover { filter: brightness(1.15); }
  button:disabled { opacity: 0.45; cursor: wait; }
</style>
</head>
<body>
  <header>
    <div class="hrow">
      <div class="brand">⚔️ QUILLAN-RONIN</div>
      <div class="council-badge" id="councilBadge">C0-COUNCIL</div>
      <select id="mode" style="background: #0a0d12; color: var(--gold); border: 1px solid var(--line); border-radius: 6px; font-size: 11px; padding: 2px 6px;">
        <option value="standard">Standard (Fast)</option>
        <option value="architect">Architect</option>
        <option value="fulldive">Full Dive</option>
      </select>
    </div>
    <div class="hrow">
      <div class="btns">
        <button class="mini" id="histBtn">🕘 History</button>
        <button class="mini gold" id="saveBtn">💾 Save</button>
        <button class="mini red" id="cleanMcpBtn" title="Clean orphaned MCP background processes">🧹 Clean MCPs</button>
        <button class="mini" id="panelBtn" title="Open persistent SidePanel">📌 Panel</button>
      </div>
      <span id="memline" style="font-size: 10.5px; color: var(--dim);"></span>
    </div>
  </header>

  <div id="actionToolbar">
    <button class="action-btn" id="explainBtn">📄 Explain</button>
    <button class="action-btn" id="scrapeBtn">🔍 Scrape</button>
    <button class="action-btn" id="indexBtn">🎯 Marks</button>
    <button class="action-btn chess" id="chessBtn">♟️ Move</button>
    <button class="action-btn" id="taskBtn">⚡ Run Goal</button>
  </div>

  <div id="historyPanel"></div>
  
  <div id="log">
    <div class="msg sys">⚔️ Quillan-Ronin Sovereign Engine online. Ask anything, explain pages, or execute browsing goals.</div>
  </div>

  <footer>
    <div class="input-row">
      <input id="q" placeholder="⟩ Ask Quillan or command the browser..." autocomplete="off">
      <button class="send-btn" id="send">Send</button>
    </div>
  </footer>

<script src="popup.js"></script>
</body>
</html>
